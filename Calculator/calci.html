<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="/Calculator/calci.css">
</head>
<body>
  <div class="calculator">
    <input type="text" class="display" disabled placeholder="0" />

    <div class="buttons">
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>0</button>

      <button>+</button>
      <button>-</button>
      <button>*</button>
      <button>/</button>
      <button class="equal">=</button>
      <button class="clear">Clear</button>
    </div>

  </div>

  <script src="/Calculator/calci.js"></script>
</body>
</html>
